name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.15.10,<0.16"
      - run: ruff format --check src
      - run: ruff check src
      # Every published score must follow from the published raw answers.
      - name: Rescore from the raw answers
        run: |
          set -e
          engines=odoo,gemini-flash,gemini-pro,gemini-2.5-pro,claude-sonnet,gpt,mistral-ocr
          for run in results/*/r*/; do
            set_dir=$(dirname "$run")
            for strict in "" "--strict"; do
              python src/bench_invoices.py "$set_dir" "$run" --engines "$engines" --score-only $strict > /dev/null
            done
          done
          python src/aggregate.py results > /dev/null
          git diff --exit-code -- results
